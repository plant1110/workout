<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="format-detection" content="telephone=no">
<title>Workout</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cg stroke='%23c3f53c' stroke-width='5.5' stroke-linecap='round' fill='none'%3E%3Cpath d='M21 20v24M43 20v24M11 26v12M53 26v12M21 32h22'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0b0d10; --card:#14171c; --card2:#1a1e24; --line:#262c34;
  --tx:#f2f5f7; --dim:#8b96a2; --acc:#c3f53c; --warm:#ff8a3d; --bad:#ff5f57;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior-y:none}
body{position:relative;display:flex;flex-direction:column;height:100dvh}
#scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:18px}
body{
  background:var(--bg); color:var(--tx);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
#app{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 8px}
h1{font-size:30px;font-weight:650;letter-spacing:-.6px;margin:0;line-height:1.15}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 0 10px;font-weight:600}
.sub{color:var(--dim);font-size:15px;margin-top:3px}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.badge{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:6px 12px;border-radius:999px}
.badge.big{font-size:15px;padding:9px 18px;letter-spacing:.09em}
.badge.bulk{background:rgba(255,138,61,.15);color:var(--warm)}
.badge.cut{background:rgba(195,245,60,.15);color:var(--acc)}
.badge.maintain{background:rgba(139,152,169,.16);color:var(--dim)}
.badge.rest{background:rgba(139,152,169,.16);color:var(--dim)}
.stat{display:flex;gap:8px;margin-top:14px}
.stat > div{flex:1;background:var(--card2);border-radius:13px;padding:12px 11px;min-width:0}
.stat .k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.wicon{display:inline-flex;width:23px;height:23px;flex:none;color:var(--dim)}
.wicon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn{width:45px;height:45px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ibtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.on{border-color:var(--acc);color:var(--acc);background:rgba(195,245,60,.1)}
.daychip{width:40px;height:40px;border-radius:99px;padding:0;font-weight:600;font-size:15px;color:var(--dim);flex:none}
.daychip.on{background:var(--acc);border-color:var(--acc);color:#0f1400}
.stat .v{font-size:22px;font-weight:650;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
.stat .v small{font-size:13px;font-weight:500;color:var(--dim)}
.bar{height:8px;background:#222a34;border-radius:99px;overflow:hidden;margin-top:9px}
.bar > i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warm > i{background:var(--warm)}
/* week date strip */
.strip{display:flex;align-items:center;gap:0;margin:0 0 18px}
.strip button.x{padding:6px 3px;font-size:22px}
.strip .cells{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1}
.dcell{text-align:center;cursor:pointer;user-select:none;padding:2px 0}
.dcell .dw{font-size:12px;color:var(--dim);margin-bottom:6px}
.dcell .dn{width:42px;height:42px;margin:0 auto;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.dcell.istoday .dn{box-shadow:inset 0 0 0 1.5px rgba(195,245,60,.55)}
.dcell.sel .dn{background:var(--acc);color:#0f1400;box-shadow:none}
.dcell .dot{width:5px;height:5px;border-radius:99px;margin:5px auto 0;background:transparent}
.dcell .dot.plan{background:var(--dim)}
.dcell .dot.part{background:var(--warm)}
.dcell .dot.full{background:var(--acc)}
.tap{cursor:pointer}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);
  margin:-18px -18px 12px;padding:13px 18px;border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid var(--line)}
.chead.solo{margin-bottom:-18px;border-radius:var(--r);border-bottom:0}
.dragh{color:var(--dim);font-size:17px;letter-spacing:1px;padding:8px 10px 8px 2px;cursor:grab;touch-action:none;user-select:none;flex:none;line-height:1}
.gripbar{display:flex;justify-content:center;margin:-8px 0 2px}
.gripbar .dragh{padding:2px 26px;font-size:15px}
.dragging{opacity:.45}
.pchip{display:inline-flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.pchip button{background:none;border:0;padding:11px 6px 11px 17px;font-size:15px;font-weight:600}
.pchip .pdel{padding:11px 15px 11px 6px;color:var(--dim);font-size:17px}
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.chead + .ex{border-top:0;padding-top:4px}
.ex .name{font-weight:600;font-size:18px}
.target{color:var(--dim);font-size:15px;margin-top:3px}
.up{color:var(--acc);font-weight:600}
.chk{width:54px;height:54px;border-radius:99px;border:2px solid #334050;background:var(--card2);
  color:transparent;font-size:22px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.chk.on{background:var(--acc);border-color:var(--acc);color:#0f1400}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;-webkit-appearance:none;font-size:17px}
input:focus,select:focus{outline:none;border-color:#3b4a5e}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:5px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;user-select:none}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);border-color:var(--acc);color:#0f1400;font-weight:650}
button.ghost{background:transparent}
button.sm{padding:11px 17px;font-size:15px;border-radius:11px}
button.x{background:transparent;border:0;color:var(--dim);padding:12px;font-size:20px;line-height:1}
button.x:hover{color:var(--bad)}
.exedit{border-top:1px solid var(--line);padding:12px 0 10px}
.exedit:first-of-type{border-top:0}
.exedit .f3{margin-top:8px}
.exedit label{margin-bottom:4px}
.muted{color:var(--dim)}
.tiny{font-size:14px;color:var(--dim)}
.ring{width:60px;height:60px;flex:none}
.ring text{fill:var(--tx);font-size:12px;font-weight:700}
nav{flex:none;background:#0d0f13;
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{background:none;border:0;color:var(--dim);font-size:13px;font-weight:600;padding:11px 0;display:grid;gap:4px;justify-items:center}
nav button.on{color:var(--acc)}
nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.hist{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.hist:last-child{border-bottom:0}
.bigring{width:318px;height:318px;max-width:100%}
.arc{filter:drop-shadow(0 0 11px rgba(195,245,60,.32))}
.ringwrap{display:flex;justify-content:center;padding:30px 0 0;
  background:radial-gradient(circle at 50% 52%, rgba(195,245,60,.07), transparent 62%)}
.trow{display:flex;gap:18px;align-items:stretch}
.tcol{flex:1;min-width:0}
.tdiv{width:1px;background:var(--line)}
.tval{font-size:27px;font-weight:700;letter-spacing:-.6px;margin-top:7px;white-space:nowrap}
.tgoal{font-size:15px;color:var(--dim);font-weight:500;letter-spacing:0}
.k{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.modebtn{display:inline-flex;align-items:center;gap:8px;padding:10px 13px 10px 15px;border-radius:99px;
  font-weight:650;font-size:15px;color:var(--dim);background:var(--card);border:1px solid var(--line)}
.modebtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.modebtn.on{color:var(--tx);border-color:#3a4a5c}
.sw{width:37px;height:22px;border-radius:99px;background:#2b3544;position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:99px;background:var(--dim);transition:transform .15s ease,background .15s}
.modebtn.on .sw{background:var(--acc)}
.modebtn.on .sw i{transform:translateX(14.5px);background:#0f1400}
.addbtn{display:block;width:100%;background:transparent;border:1.5px dashed #334050;color:var(--dim);
  border-radius:var(--r);padding:17px;font-weight:600;font-size:17px;margin-bottom:14px}
.addbtn:hover{color:var(--tx);border-color:#4a5a6e}
.iconbtn{width:48px;height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--dim)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.on{color:var(--acc);border-color:rgba(195,245,60,.45)}
.wide{display:inline-flex;width:100%;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-weight:600;font-size:16px}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  max-height:86vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  animation:sheetup .22s ease}
@keyframes sheetup{from{transform:translateY(48px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet.noanim{animation:none}
.shead{padding:18px 18px 6px;font-size:19px;font-weight:650;flex:none}
.sbody{padding:2px 18px 6px;overflow-y:auto;flex:1;min-height:0}
.sfoot{display:flex;gap:10px;padding:14px 18px calc(16px + env(safe-area-inset-bottom));flex:none;border-top:1px solid var(--line)}
.sfoot button{flex:1}
.foot{display:flex;gap:8px;margin:18px 0 6px}
.foot button{flex:1;font-size:13px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card2);
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:9px;cursor:pointer;user-select:none}
.opt:active{transform:translateY(1px)}
.opt.on{border-color:rgba(195,245,60,.6);background:rgba(195,245,60,.08)}
.opt .ck{width:25px;height:25px;border-radius:99px;border:1.5px solid #334050;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.opt.on .ck{background:var(--acc);border-color:var(--acc);color:#0f1400}
.opt .oname{font-weight:600;font-size:17px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;color:var(--dim);font-size:14px;font-weight:650;padding:8px 16px;border-radius:99px}
.seg button.on{color:var(--acc);background:rgba(195,245,60,.14)}
.seg button.on.warm{color:var(--warm);background:rgba(255,138,61,.14)}
.okbtn{width:40px;height:40px;border-radius:99px;background:var(--acc);border:0;color:#0f1400;
  font-size:17px;font-weight:750;flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.fab{position:absolute;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;
  background:var(--acc);border:0;color:#0f1400;border-radius:99px;padding:15px 24px;
  font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.pcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:2px -18px 0;padding:0 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pcar::-webkit-scrollbar{display:none}
.pslide{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.pframe{position:relative;width:100%;height:min(66vh,600px);border-radius:20px;overflow:hidden;background:var(--card2);cursor:pointer}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.pgrad{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,transparent 24%,transparent 50%,rgba(11,13,16,.88) 100%)}
.pmeta{position:absolute;left:18px;right:18px;bottom:16px;color:#fff;pointer-events:none}
.pday{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin-bottom:3px}
.pbig{font-size:23px;font-weight:750;letter-spacing:-.3px}
.psub{font-size:14px;color:rgba(233,238,245,.72);margin-top:3px}
.pxdel{position:absolute;top:12px;right:12px;background:rgba(11,13,16,.72);
  border:0;color:#fff;border-radius:99px;min-width:38px;height:38px;padding:0 13px;font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.pxdel.armed{background:var(--bad);font-size:13px;font-weight:650}
.pdots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.pdots i{width:6px;height:6px;border-radius:99px;background:#2b3544;transition:all .15s}
.pdots i.on{background:var(--acc);width:18px}
.pcount{text-align:center;margin-top:13px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.04em}

/* ---------- v159 design code: plain lists, section heads, pages ---------- */
:root{--hair:#20252c}
#head{margin-bottom:14px}
.hrow{display:flex;align-items:center;gap:12px}
.gtag{font-size:14px;font-weight:650;color:var(--acc);background:rgba(195,245,60,.14);padding:5px 12px;border-radius:99px}
.gtag.bulk{color:var(--warm);background:rgba(255,138,61,.14)}
.gtag.maintain{color:var(--dim);background:rgba(139,150,162,.16)}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--acc);font-size:17px;padding:8px 10px 8px 0;margin:-8px 0 6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pgsub{font-size:16px;color:var(--dim);margin-top:3px}
.lst{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:14px}
.lst > * + *{border-top:1px solid var(--hair)}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;font-size:17px}
.li.col{flex-direction:column;align-items:stretch;gap:14px}
.li .grow{min-width:0}
.lt{font-size:17px;font-weight:500}
.ls{font-size:15px;color:var(--dim);margin-top:2px}
.lk{flex:1;color:var(--dim)}
.lv{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;color:var(--tx);text-align:right;white-space:nowrap}
.lv.dim{color:var(--dim)}
.li.acts{color:var(--acc);font-weight:500}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dimi{color:var(--dim);display:flex;flex:none}
.dt{color:var(--dim);text-decoration:line-through}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 10px;padding:0 16px;font-size:20px;font-weight:650}
.grp{font-size:15px;color:var(--dim);margin:22px 16px 8px}
.cb{width:30px;height:30px;border-radius:99px;border:2.5px solid var(--ring);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;cursor:pointer;user-select:none;-webkit-user-select:none}
.cb svg,.opt .ck svg,.ocard .ok svg{width:62%;height:62%;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.okbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.cb.on{background:var(--acc);border-color:var(--acc);color:#0f1400}
.cb.blue.on{background:#38bdf8;border-color:#38bdf8}
.danger{display:block;width:100%;background:none;border:0;text-align:center;color:var(--bad);font-size:17px;padding:14px;margin:6px 0 10px}
.bl{list-style:none;margin:6px 0 1px;padding:0}
.bl li{position:relative;padding-left:14px;font-size:14.5px;line-height:1.5;color:var(--dim)}
.bl li::before{content:"";position:absolute;left:1px;top:.66em;width:4px;height:4px;border-radius:99px;background:#46505c}
.bl .am{color:#66717d;margin-left:5px}
.bl.dimmed li,.bl.dimmed .am{color:#5d6773}
.vin{background:transparent;border:0;border-radius:0;padding:4px 0;width:auto;text-align:right;color:var(--tx);font-size:17px;flex:none}
.vwrap{display:inline-flex;align-items:baseline;gap:5px;flex:none}
.vu{color:var(--dim)}
/* menu: one card per meal, the meal row centered like every row, its foods listed under it */
.lst.meal{margin-bottom:10px}
.meal .li.mh{min-height:56px}
.meal > .fl{border-top:0;padding:0 16px 14px;margin-top:-6px}
.fi{display:flex;justify-content:space-between;gap:14px;font-size:15px;line-height:1.75;color:var(--dim)}
.fi .fa{color:#6f7a86;white-space:nowrap}
.fl.done .fi,.fl.done .fa{color:#566170}
.pk{font-size:15px;line-height:1.55;color:var(--dim);margin-top:4px}
/* value sheet (Apple style): Cancel / Done pills, rows, a wheel at the bottom */
.vs{position:absolute;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:#1b1e24;border-radius:30px 30px 0 0;
  max-height:94%;overflow-y:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom));animation:sheetup .22s ease}
.vs.noanim{animation:none}
.vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pill{background:#2b3038;border:0;border-radius:99px;padding:12px 20px;font-size:17px;font-weight:500;color:var(--tx)}
.pill.acc{background:var(--acc);color:#0f1400;font-weight:650}
.vtitle{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:0 4px 16px}
.vs .lst{background:#262a31}
.vs .lst > * + *{border-top-color:#30353d}
.vs .lk{color:var(--tx)}
.vs .lv{color:var(--dim)}
.vs .lv.on{color:var(--acc)}
.vtxt{flex:1;min-width:0;background:transparent;border:0;border-radius:0;padding:4px 0;text-align:right;font-size:17px;color:var(--tx)}
.vtxt:focus{outline:none;border:0}
/* the docked wheel (like Apple Fitness): a Done pill above a picker panel at the bottom */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:45;max-width:560px;margin:0 auto;animation:dockup .24s ease}
.dock.noanim{animation:none}
@keyframes dockup{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.dkdone{display:block;width:calc(100% - 32px);margin:0 16px 10px;padding:15px;border-radius:99px;font-size:17px;font-weight:600;color:var(--tx);
  background:rgba(72,77,88,.38);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 26px rgba(0,0,0,.28);

<div id="scroll">

<script>
"use strict";
const KEY = "workout.v1";
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const uid = () => Math.random().toString(36).slice(2,9);
const num = (v, d=0) => { const n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? d : n; };
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const CK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10" /></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- dates ---------- */
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseIso = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const dayIdx = d => ((d.getDay() + 6) % 7) + 1;            // 1 = Monday ... 7 = Sunday
const mondayOf = d => { const x = startOfDay(d); x.setDate(x.getDate() - (dayIdx(x) - 1)); return x; };

/* ---------- state ---------- */
function seed(){
  const ex = (name, sets, reps, weight) => ({ id: uid(), name, sets, reps, weight });
  const act = (title, mins, days) => ({ id: uid(), title, type: "activity", mins, days });
  const wk = (title, exercises, days) => ({ id: uid(), title, exercises, days });
  const today = new Date();
  return {
    profile: {
      mode: "bulk",
      weightStart: 78, weightNow: 79.2, weightTarget: 84,
      fatStart: 18, fatNow: 17.4, fatTarget: 15,
      regimeDays: 90,
      anchor: iso(mondayOf(today))
    },
    measurements: [],
    workouts: [
      wk("Upper", [
        ex("Разминка",1,1,0),
        ex("Брусья",3,15,0),
        ex("Подтягивания",3,12,0),
        ex("Грудь в кроссовере",2,15,10.2),
        ex("Спина в кроссовере (2х2х15)",4,15,12.5),
        ex("Подъемы на предплечья (2х2х15)",4,15,12),
        ex("Обратные отжимания на трицепс на скамье под 45°",2,15,12),
        ex("Заминка",1,1,0)
      ], [1]),
      wk("Lower", [
        ex("Разминка",1,1,0),
        ex("Приседания с грифом (8-15-12-10, 0-10-15-20 кг)",4,12,20),
        ex("Подъемы на икры с гантелями на одной ноге (2х3х12)",6,12,15),
        ex("Присяды с гирей на подножке",2,15,16),
        ex("Подъемы на плечи на скамье",2,15,10),
        ex("Плечи в кроссовере (2х2х12)",4,12,11),
        ex("Заминка",1,1,0)
      ], [2]),
      act("Swimming", 45, [3, 6]),
      wk("Upper", [
        ex("Разминка",1,1,0),
        ex("Гантели лежа на скамье",3,15,8),
        ex("Тяга грифа вниз в кроссовере",3,15,20),
        ex("Отжимания (Бабочка)",2,12,10),
        ex("Подтягивания (Тяга на себя)",2,20,25),
        ex("Молотки стоя",2,20,7),
        ex("Жим гантели из-за головы",2,15,15),
        ex("Заминка",1,1,0)
      ], [4]),
      wk("Lower", [
        ex("Разминка",1,1,0),
        ex("Квадрицепс в горизонтальном кроссовере",3,15,60),
        ex("Подъемы на икры в смите",3,20,30),
        ex("Болгарские приседы",2,15,12),
        ex("Подъемы на икры сидя",2,20,35),
        ex("Плечи в кроссовере (2х2х15)",4,15,15),
        ex("Складывания на пресс на скамье",2,15,0),
        ex("Заминка",1,1,0)
      ], [5])
    ],
    planV2: true,
    backup: [wk("Home workout", [ex("Push-ups",4,15,0), ex("Air squats",4,20,0), ex("Plank, sec",3,60,0)])],
    homeDays: {},
    nutrition: { rules: [{ id: "water", name: "Water", kind: "count", target: 5, unit: "glasses" }], logs: {}, menu: [
      { id: uid(), name: "Breakfast", home: false },
      { id: uid(), name: "Lunch",     home: false },
      { id: uid(), name: "Dinner",    home: false }
    ], exclusions: [{ id: uid(), name: "Sugar", limit: 3, xcat: "snack" }], exlog: {} },
    rules: [
      { id: uid(), scope: "all", metric: "reps",   amount: 1, every: 1, cap: 4  },
      { id: uid(), scope: "all", metric: "weight", amount: 1, every: 2, cap: 20 }
    ],
    logs: {}
  };
}


let state, tab = "home";
let sel = iso(new Date());     // selected date on the main screen
let weekOffset = 0;            // which week the strip shows, 0 = current
let armed = null;              // destructive button awaiting second tap
let sheet = null;              // bottom sheet: { kind: "workout"|"menu", toBackup?, draft }
let sheetNew = false;          // sheet just opened -> play the slide-in once
let wtAdd = null;              // workout editor currently showing the new-type inset
let wtAddIcon = null;          // icon selected in that inset
let wtAddName = "";            // name typed in that inset (survives re-renders)
let gMetric = "weight";        // trend graph: which metric
let gSel = null;               // trend graph: date of the tapped point (its value shown), null = none
let gEdit = null;              // trend history: date of the log being edited
let gAdd = false;              // trend graph: add-log inset open
let pages = [];                // full pages pushed over the tab: {k, id?, w?, i?, y?}
let tabY = 0;                  // tab scroll position, restored when the last page closes
let rowOpen = null;            // which value row is expanded on the open page ("goal", "wdays", ...)
let foodOpen = null;           // menu item page: index of the food edited in place
let onb = null;                // new-cycle onboarding draft
let swSup = 0;                 // time a drag ended: the click right after it is not a tap
try { state = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch(e) { state = seed(); }
// v147: history snapshots REMOVED — every day is judged by the current plan + that day's logs
delete state.snaps;
try { localStorage.removeItem("workout.snaps.v1"); } catch(e) {}
if (state.profile.regimeDays == null) state.profile.regimeDays = 90;
if (!state.backup){
  const ex = (name, sets, reps, weight) => ({ id: uid(), name, sets, reps, weight });
  state.backup = [{ id: uid(), title: "Home workout", exercises: [ex("Push-ups",4,15,0), ex("Air squats",4,20,0), ex("Plank, sec",3,60,0)] }];
}
if (!state.homeDays) state.homeDays = {};
if (!state.nutrition) state.nutrition = { rules: [], logs: {} };
if (!state.nutrition.exlog) state.nutrition.exlog = {};
if (!state.nutrition.xpicks) state.nutrition.xpicks = {};
if (state.nutrition.cheat){
  state.nutrition.exclusions = state.nutrition.exclusions || [];
  const ch = state.nutrition.cheat;
  const nid = uid();
  state.nutrition.exclusions.push({ id: nid, name: "Cheat", limit: num(ch.limit, 3), alts: [...(ch.options || [])] });
  for (const d in state.nutrition.exlog){
    if (state.nutrition.exlog[d].cheat){ state.nutrition.exlog[d][nid] = state.nutrition.exlog[d].cheat; delete state.nutrition.exlog[d].cheat; }
  }
  for (const d in state.nutrition.xpicks){
    if (state.nutrition.xpicks[d].cheat){ state.nutrition.xpicks[d][nid] = state.nutrition.xpicks[d].cheat; delete state.nutrition.xpicks[d].cheat; }
  }
  delete state.nutrition.cheat;
}
if (!state.nutrition.exclusions) state.nutrition.exclusions = [];
if (!state.nutrition.rules) state.nutrition.rules = [];
state.nutrition.rules.forEach(r => { if (!r.kind) r.kind = "check"; });
if (state.nutrition.water && state.nutrition.water.goal != null){   // the pre-v70 water object (it had a goal)
  if (!state.nutrition.rules.some(r => r.id === "water"))
    state.nutrition.rules.push({ id: "water", name: "Water", kind: "count", target: num(state.nutrition.water.goal, 5), unit: "glasses" });
  for (const d in (state.nutrition.wlog || {})){
    if (state.nutrition.wlog[d]) (state.nutrition.logs[d] = state.nutrition.logs[d] || {}).water = state.nutrition.wlog[d];
  }
  delete state.nutrition.water; delete state.nutrition.wlog;
}
if (!state.nutrition.mopts) state.nutrition.mopts = {};
if (!state.nutrition.xmeal) state.nutrition.xmeal = {};
if (!state.xtypes) state.xtypes = [];                 // cheat TYPES carry the budget: {id, name, limit, xper, replaces}
if (!state.nutrition.tlog) state.nutrition.tlog = {};  // { date: { typeId: [{x, label, cost, slot?, ns?}] } } — the one cheat log
if (!state.nutrition.xnoslot) state.nutrition.xnoslot = {};   // per-day count of cheat uses with no free menu slot (voids the day)
if (!state.verdicts) state.verdicts = {};   // frozen day results: once a day has ended its color is FINAL
if (!state.regimes) state.regimes = [];      // finished cycles: {from, to, mode, days:"gor...", wd, nd, w:{start,end,target}, f:{...}}
if (!state.regMode1){
  state.regimes.forEach(rg => {
    if (rg.mode || !rg.w) return;
    const s0 = num(rg.w.start, NaN), t0 = num(rg.w.target, NaN);
    if (!isNaN(s0) && !isNaN(t0)) rg.mode = t0 < s0 ? "cut" : t0 > s0 ? "bulk" : "maintain";
  });
  state.regMode1 = true;
}
if (!state.wopts) state.wopts = {};
const normFood = it => typeof it === "string" ? { name: it, amt: "" } : it;
state.nutrition.menu.forEach(m => {
  if (m.items) m.items = m.items.map(normFood);
  if (m.alts) m.alts = m.alts.map(a => typeof a === "string" ? { name: a, items: [] } : a);
  (m.alts || []).forEach(a => { if (!a.id) a.id = uid(); if (a.items) a.items = a.items.map(normFood); });
  if (!m.mtype){
    const n = (m.name || "").toLowerCase();
    m.mtype = n.includes("breakfast") ? "breakfast" : n.includes("lunch") ? "lunch" : n.includes("dinner") ? "dinner" : "snack";
  }
});
state.nutrition.exclusions.forEach(x => { if (x.alts) x.alts = x.alts.map(normFood); });
(state.nutrition.presets || []).forEach(pr => {
  (pr.menu || []).forEach(m => {
    if (m.items) m.items = m.items.map(normFood);
    (m.alts || []).forEach(a => { if (a.items) a.items = a.items.map(normFood); });
  });
  (pr.exclusions || []).forEach(x => { if (x.alts) x.alts = x.alts.map(normFood); });
});
for (const d in state.nutrition.mopts){
  for (const mid in state.nutrition.mopts[d]){
    const v = state.nutrition.mopts[d][mid];
    const m = state.nutrition.menu.find(x => x.id === mid);
    if (!m) continue;
    const alt = (m.alts || []).find(a => a.name === v);   // very old picks stored the alt's name
    if (alt) state.nutrition.mopts[d][mid] = alt.id;
  }
}
// alternatives are gone as a concept: promote them to standalone unscheduled items (same id, so picks keep resolving)
{
  const promoted = [];
  state.nutrition.menu.forEach(m => {
    (m.alts || []).forEach(a => promoted.push({
      id: a.id,
      name: (a.name && a.name !== m.name) ? a.name : (((a.items || [])[0] || {}).name || m.name + " 2"),
      mtype: m.mtype, days: [], items: a.items || []
    }));
    delete m.alts;
  });
  state.nutrition.menu.push(...promoted);
}
for (const d in state.nutrition.mopts){
  for (const mid in state.nutrition.mopts[d]){
    if (!state.nutrition.menu.some(x => x.id === state.nutrition.mopts[d][mid])) delete state.nutrition.mopts[d][mid];
  }
}
for (const d in state.nutrition.logs) for (const id in state.nutrition.logs[d]){
  const v = state.nutrition.logs[d][id];
  if (typeof v === "string"){
    (state.nutrition.mopts[d] = state.nutrition.mopts[d] || {})[id] = v;
    state.nutrition.logs[d][id] = true;
  }
}
if (!state.nutrition.menu) state.nutrition.menu = [
  { id: uid(), name: "Breakfast", home: false },
  { id: uid(), name: "Lunch",     home: false },
  { id: uid(), name: "Dinner",    home: false }
];
if (!state.nutrition.presets) state.nutrition.presets = [

function weeksElapsed(){
  const a = mondayOf(parseIso(state.profile.anchor || iso(new Date())));
  const w = Math.floor((mondayOf(new Date()) - a) / 6048e5);
  return Math.max(0, w);
}
function daysElapsed(){
  const a = parseIso(state.profile.anchor || iso(new Date()));
  return Math.max(1, Math.floor((startOfDay(new Date()) - a) / 864e5) + 1);
}
// one rule, evaluated at week w: raw growth, capped value, and whether it is finished
function ruleDelta(r, w){
  const every = Math.max(1, num(r.every, 1));
  const amt = num(r.amount, 0);
  const raw = Math.floor(w / every) * amt;
  const hasCap = r.cap != null && String(r.cap).trim() !== "";
  const cap = Math.abs(num(r.cap, 0));
  const val = !hasCap ? raw : (amt < 0 ? Math.max(raw, -cap) : Math.min(raw, cap));
  const capped = hasCap && Math.abs(raw + amt) > cap;
  return { every, amt, raw, val, capped, weeksToNext: every - (w % every) };
}
// total delta this exercise has earned from the autorules, by metric
function deltas(exId){
  const w = weeksElapsed();
  const out = { sets: 0, reps: 0, weight: 0, mins: 0 };
  for (const r of state.rules){
    if (r.scope !== "all" && r.scope !== exId) continue;
    if (out[r.metric] != null) out[r.metric] += ruleDelta(r, w).val;
  }
  return out;
}

  const d = deltas(ex.id);
  if (ex.type === "time"){
    return { time: true, mins: Math.max(1, num(ex.mins, 30) + d.mins), d };
  }
  return {
    time: false,
    sets:   Math.max(1, num(ex.sets,1)   + d.sets),
    reps:   Math.max(1, num(ex.reps,1)   + d.reps),
    weight: Math.max(0, num(ex.weight,0) + d.weight),

}

function bigRing(sub, subColor){
  const p = state.profile;
  const total = Math.max(1, num(p.regimeDays, 90));
  const de = daysElapsed();
  const r = 63, C = 2 * Math.PI * r;
  const seg = C / total;
  const gap = Math.min(1.6, seg * 0.3);
  const todayIso = iso(new Date());
  const start = parseIso(p.anchor);
  let arcs = "";
  for (let i2 = 0; i2 < Math.min(de, total); i2++){
    const d = new Date(start); d.setDate(d.getDate() + i2);
    const ds = iso(d);
    const f = dayFlags(ds);
    let color = null;
    const fails = (f.wPlanned && !f.wOk ? 1 : 0) + (f.nTracked && !f.nOk ? 1 : 0);
    if (ds === todayIso){
      const doneOne = (f.wPlanned && f.wOk) || (f.nTracked && f.nOk);
      if (fails === 0 && (f.wPlanned || f.nTracked)) color = "var(--acc)";   // fully done -> green
      else if (doneOne) color = "var(--warm)";                               // one of two done -> orange
      else color = "#3a4656";                                               // nothing yet -> empty placeholder
    } else {
      color = fails === 0 ? "var(--acc)" : fails === 1 ? "var(--warm)" : "var(--bad)";
    }
    if (!color) continue;
    arcs += `<circle cx="75" cy="75" r="${r}" stroke="${color}" stroke-width="10" fill="none"
      stroke-dasharray="${(seg - gap).toFixed(2)} ${(C - seg + gap).toFixed(2)}"
      stroke-dashoffset="${(-i2 * seg).toFixed(2)}" transform="rotate(-90 75 75)"/>`;
  }
  return `<svg class="bigring" viewBox="5 5 140 140">
    <circle cx="75" cy="75" r="${r}" stroke="#1c232d" stroke-width="10" fill="none"/>
    ${arcs}
    <text x="75" y="81" text-anchor="middle" style="font-size:42px;font-weight:700;fill:var(--tx);letter-spacing:-1.5px">${Math.min(de, total)}</text>
    <text x="75" y="102" text-anchor="middle" style="font-size:12.5px;font-weight:500;fill:${subColor || "var(--dim)"}">${sub}</text>
  </svg>`;
}

// US Navy tape method, male, cm. ±3-4% real-world error, so 1 decimal only.
function tapeBF(p){
  const h = num(p.heightCm, 0), w = num(p.waistCm, 0), n = num(p.neckCm, 0);
  if (!(h > 0 && w > 0 && n > 0)) return { state: "empty" };
  if (w <= n) return { state: "bad" };
  const bf = Math.round((495 / (1.0324 - 0.19077 * Math.log10(w - n) + 0.15456 * Math.log10(h)) - 450) * 10) / 10;
  return { state: bf >= 3 && bf <= 60 ? "ok" : "off", bf };
}

/* ---------- cycles ---------- */
const MODE_LBL = { bulk: "Bulk", cut: "Cut", maintain: "Maintain" };
const modeLbl = m => MODE_LBL[m] || cap1(m || "");
const cycleNo = () => (state.regimes || []).length + 1;
function cycleEnd(){
  const p = state.profile;
  const e = parseIso(p.anchor); e.setDate(e.getDate() + Math.max(1, num(p.regimeDays, 30)) - 1);
  return iso(e);
}
const cycleEnded = () => iso(new Date()) > cycleEnd();
const dRange = (a, b) => `${pdate(a)} &ndash; ${pdate(b)}`;
// a day's ring color: g = workout and nutrition done, o = one of them, r = neither
function dayCode(ds){
  const f = dayFlags(ds);
  const fails = (f.wPlanned && !f.wOk ? 1 : 0) + (f.nTracked && !f.nOk ? 1 : 0);
  return fails === 0 ? "g" : fails === 1 ? "o" : "r";
}
// the running cycle as ring codes: past days colored, today live (p = nothing yet), future empty
function curCodes(){
  const p = state.profile, total = Math.max(1, num(p.regimeDays, 30)), de = daysElapsed(), today = iso(new Date());
  const out = [];
  for (let i = 0; i < total; i++){
    if (i >= de){ out.push("e"); continue; }
    const d = parseIso(p.anchor); d.setDate(d.getDate() + i);
    const ds = iso(d);
    if (ds !== today){ out.push(dayCode(ds)); continue; }
    const f = dayFlags(ds);
    const fails = (f.wPlanned && !f.wOk ? 1 : 0) + (f.nTracked && !f.nOk ? 1 : 0);
    const doneOne = (f.wPlanned && f.wOk) || (f.nTracked && f.nOk);
    out.push(fails === 0 && (f.wPlanned || f.nTracked) ? "g" : doneOne ? "o" : "p");
  }
  return out.join("");
}
const SEGC = { g: "var(--acc)", o: "var(--warm)", r: "var(--bad)", p: "#3a4656" };
function segRing(codes, px, sw){
  const n = Math.max(1, codes.length), r = 50 - sw / 2 - 1, C = 2 * Math.PI * r, seg = C / n;
  const gap = Math.min(1.8, seg * 0.3);
  let arcs = "";
  [...codes].forEach((c, i) => {
    if (!SEGC[c]) return;
    arcs += `<circle cx="50" cy="50" r="${r}" stroke="${SEGC[c]}" stroke-width="${sw}" fill="none"
      stroke-dasharray="${(seg - gap).toFixed(2)} ${(C - seg + gap).toFixed(2)}" stroke-dashoffset="${(-i * seg).toFixed(2)}" transform="rotate(-90 50 50)"/>`;
  });
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" style="display:block">
    <circle cx="50" cy="50" r="${r}" stroke="#1c232d" stroke-width="${sw}" fill="none"/>${arcs}</svg>`;
}
const mring = codes => `<div class="mring">${segRing(codes, 48, 10)}<b>${[...codes].filter(c => c === "g").length}</b></div>`;
function lastValTo(k, to){
  const m = (state.measurements || []).filter(x => x[k] != null && !isNaN(num(x[k], NaN)) && x.date <= to)
    .sort((a, b) => a.date < b.date ? -1 : 1).at(-1);
  return m ? num(m[k]) : null;
}
// the part of the running cycle that is over (never includes today)
function archiveRange(){
  if (!Object.keys(state.logs).length && !Object.keys(state.nutrition.logs).length) return null;   // nothing logged, nothing to keep
  const y = new Date(); y.setDate(y.getDate() - 1);
  const end = cycleEnd(), to = end < iso(y) ? end : iso(y);
  const from = state.profile.anchor;
  return from && from <= to ? { from, to } : null;
}
// the running cycle as a results record (stored when the next cycle starts)
function cycleRecord(from, to){
  const p = state.profile;
  const days = [];
  let wd = 0, nd = 0;
  for (let d = parseIso(from); iso(d) <= to; d.setDate(d.getDate() + 1)){
    const ds = iso(d), f = dayFlags(ds);
    days.push(dayCode(ds));
    if (f.wPlanned && f.wOk) wd++;
    if (f.nTracked && f.nOk) nd++;
  }
  return { from, to, mode: p.mode, days: days.join(""), wd, nd,
    w: { start: p.weightStart, end: lastValTo("weight", to) ?? p.weightNow, target: p.weightTarget },
    f: { start: p.fatStart, end: lastValTo("fat", to) ?? p.fatNow, target: p.fatTarget } };
}

// the trend, drawn like the approved draft: a line between two dashed guides (its first log and
// its goal) with their values dim on the left, the goal a ring at the cycle end. With both metrics
// logged, each gets its own band (weight above, body fat below) over one date axis.
function trend2Svg(series, fromIso, toIso){
  const S = series.filter(sr => sr.pts.length);
  const W = 330, L = 40, xR = W - 12, top = 26;
  const band = S.length > 1 ? 58 : 83, gap = 34;
  const base = top + band * S.length + gap * (S.length - 1) + 17, H = base + 21;
  const x0 = parseIso(fromIso).getTime(), x1 = parseIso(toIso).getTime();
  const px = t => L + 4 + (xR - L - 4) * (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0));
  const path = P => {
    let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
    for (let i = 0; i < P.length - 1; i++){
      const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], e = P[Math.min(P.length - 1, i + 2)];
      d += `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)},${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)},${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`;
    }
    return d;
  };
  let body = "";
  S.forEach((sr, k) => {
    const yHi = top + k * (band + gap), yLo = yHi + band;
    const vs = sr.pts.map(q => q.v), first = vs[0], g = sr.target;
    // the guides sit at the first log and the goal; without a distinct goal, at the logs' range
    let hiV, loV;
    if (g != null && Math.abs(g - first) > 1e-9){ hiV = Math.max(first, g); loV = Math.min(first, g); }
    else { hiV = Math.max(...vs, g ?? -Infinity); loV = Math.min(...vs, g ?? Infinity); }
    const flat = hiV - loV < 1e-9;
    const py = v => flat ? (yHi + yLo) / 2 : clamp(yHi + (yLo - yHi) * (hiV - v) / (hiV - loV), yHi - 16, yLo + 14);
    const atGoal = v => g != null && Math.abs(v - g) < 1e-9;
    body += (flat ? [hiV] : [hiV, loV]).map(v => `<line x1="${L}" y1="${py(v).toFixed(1)}" x2="${W - 4}" y2="${py(v).toFixed(1)}" stroke="#262f3b" stroke-width="1.2" stroke-dasharray="3 5"/>
      ${atGoal(v) ? "" : `<text x="${L - 7}" y="${(py(v) + 4.5).toFixed(1)}" text-anchor="end" style="font-size:13px;fill:var(--dim)">${fmt(v)}</text>`}`).join("");
    const P = sr.pts.map(q => [px(parseIso(q.date).getTime()), py(q.v)]);
    if (g != null){
      const lp = P[P.length - 1];
      body += `<line x1="${lp[0].toFixed(1)}" y1="${lp[1].toFixed(1)}" x2="${xR}" y2="${py(g).toFixed(1)}" stroke="${sr.color}" stroke-width="1.8" stroke-dasharray="2 6" stroke-linecap="round" opacity=".6"/>`;
    }
    if (P.length > 1) body += `<path d="${path(P)}" fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    body += P.map(q => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.2" fill="${sr.color}" stroke="var(--card)" stroke-width="1.6"/>`).join("");
    if (g != null){
      const gy = py(g);
      body += `<circle cx="${xR}" cy="${gy.toFixed(1)}" r="5" fill="var(--card)" stroke="${sr.color}" stroke-width="2.5"/>
        <text x="${xR - 3}" y="${(gy - 11).toFixed(1)}" text-anchor="middle" style="font-size:14.5px;font-weight:700;fill:${sr.color}">${fmt(g)}</text>`;
    }
  });
  const mid = new Date((x0 + x1) / 2);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${body}
    <line x1="${L}" y1="${base}" x2="${W - 4}" y2="${base}" stroke="#2b3544" stroke-width="1.2"/>
    <text x="${L}" y="${base + 17}" style="font-size:12.5px;fill:var(--dim)">${pdate(fromIso)}</text>
    <text x="${((L + W - 4) / 2).toFixed(1)}" y="${base + 17}" text-anchor="middle" style="font-size:12.5px;fill:var(--dim)">${pdate(iso(mid))}</text>
    <text x="${W - 4}" y="${base + 17}" text-anchor="end" style="font-size:12.5px;fill:var(--dim)">${pdate(toIso)}</text>
  </svg>`;
}

// reverse a cheat-filled meal slot: drop the link and un-log that cheat pick
function unXmeal(mid){

  const list = ((state.nutrition.tlog[sel] || {}).all) || [];

  ["weight", "fat"].forEach(k => {
    const withK = (state.measurements || []).filter(m => m[k] != null && !isNaN(num(m[k], NaN)))
      .sort((a, b) => a.date < b.date ? -1 : 1);
    if (withK.length) state.profile[k === "weight" ? "weightNow" : "fatNow"] = num(withK[withK.length - 1][k]);
  });

// the chart period IS the regime window set on the Home page
function gPeriod(){
  const anchor = state.profile.anchor || iso(new Date());
  const e = parseIso(anchor);
  e.setDate(e.getDate() + Math.max(1, num(state.profile.regimeDays, 90)) - 1);

function cycleRows(){

function xring(c, limit, color, px = 54){

/* ---------- progress photos: stored in IndexedDB (localStorage is too small for images) ---------- */
let photos = [];                                  // { id, date, url } newest first, in-memory mirror
function ptx(mode, fn){
  return new Promise((res, rej) => {
    const q = indexedDB.open("workout.photos", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("photos", { keyPath: "id" });
    q.onerror = () => rej(q.error);
    q.onsuccess = () => {
      const db = q.result, t = db.transaction("photos", mode);
      const out = fn(t.objectStore("photos"));
      t.oncomplete = () => { db.close(); res(out && out.result); };
      t.onerror = () => { db.close(); rej(t.error); };
    };
  });
}
function loadPhotos(){
  return ptx("readonly", st => st.getAll()).then(rows => {
    photos = (rows || []).sort((a, b) => (b.ts || 0) - (a.ts || 0))
      .map(r => ({ id: r.id, date: r.date, url: URL.createObjectURL(r.blob) }));
  }).catch(() => {});
}
function addPhoto(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(blob => {
        if (!blob) return res();
        const rec = { id: uid(), date: iso(new Date()), ts: Date.now(), blob };
        ptx("readwrite", st => st.put(rec)).then(() => {
          photos.unshift({ id: rec.id, date: rec.date, url: URL.createObjectURL(blob) });
          res();
        }).catch(res);
      }, "image/jpeg", 0.85);
    };
    img.onerror = () => res();
    img.src = URL.createObjectURL(file);
  });
}
function delPhoto(id){
  return ptx("readwrite", st => st.delete(id)).then(() => {
    const p = photos.find(x => x.id === id);
    if (p) URL.revokeObjectURL(p.url);
    photos = photos.filter(x => x.id !== id);
  }).catch(() => {});
}

function habitPeriodCount(h, ds){
  const per = h.xper || "day";
  if (per === "day") return num((state.nutrition.logs[ds] || {})[h.id], 0);
  if (per === "month"){
    const pre = ds.slice(0, 7);
    let n = 0;
    for (const k in state.nutrition.logs) if (k.slice(0, 7) === pre) n += num(state.nutrition.logs[k][h.id], 0);
    return n;
  }
  const mon = mondayOf(parseIso(ds));
  let n = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(mon); d.setDate(d.getDate() + i);
    n += num((state.nutrition.logs[iso(d)] || {})[h.id], 0);
  }
  return n;
}
function habitDone(h, ds){
  const v = (state.nutrition.logs[ds] || {})[h.id];
  if (h.kind === "limit") return habitPeriodCount(h, ds) <= num(h.target, 0);
  return h.kind === "count" ? num(v, 0) >= num(h.target, 1) : !!v;
}

// an ENDED day's result is frozen in state.verdicts — later plan changes never recolor it.
// Acting on that day (logging/unchecking while it's selected) clears its verdict via save(),
// so it re-judges once and freezes again. Today is always judged live.
function dayFlags(ds){
  const past = ds < iso(new Date());
  if (past && state.verdicts[ds]) return state.verdicts[ds];
  const exIds = exercisesFor(ds).map(e => e.id);
  const wPlanned = exIds.length > 0;
  const wOk = !wPlanned || exIds.every(id => exDone(ds, { id }));
  const di0 = dayIdx(parseIso(ds));
  const meals = state.nutrition.menu.filter(m => !m.days || m.days.includes(di0));
  const wt = num(waterOf().target, 0), ln = state.nutrition.logs[ds] || {};
  const nTracked = meals.length > 0 || wt > 0;
  const nOk = !nTracked || (meals.every(m => ln[m.id]) && num(ln.water, 0) >= wt && weekOkFor(ds) && !num((state.nutrition.xnoslot || {})[ds], 0));
  const r = { wPlanned, wOk, nTracked, nOk };
  if (past) state.verdicts[ds] = r;   // persists with the next save; deterministic until then
  return r;
}

function daysDone(kind){
  let n = 0;
  const start = parseIso(state.profile.anchor);
  const today = startOfDay(new Date()), end = parseIso(cycleEnd());
  const stop = today < end ? today : end;
  for (let d = new Date(start); d <= stop; d.setDate(d.getDate() + 1)){
    const f = dayFlags(iso(d));
    if (kind === "w" ? (f.wPlanned && f.wOk) : (f.nTracked && f.nOk)) n++;
  }
  return n;
}

// every destructive control is tap-twice: first tap arms, second deletes
const delBtn = (act, key, data) => armed === `${act}:${key}`
  ? `<button class="ghost sm" data-act="${act}" ${data} style="color:var(--bad);border-color:rgba(255,95,87,.35);flex:none;padding:8px 12px;font-size:13px">Tap again</button>`
  : `<button class="x" data-act="${act}" ${data} title="Remove">&times;</button>`;
const amtLabel = it => esc(it.name) + (it.amt ? ` &middot; ${esc(it.amt)}` : "");
// a cheat has no title: it IS its type (legacy cheats may still carry a name)
// meal/snack cheats replace a free menu slot: meal -> lunch/dinner, snack -> snack.
// undefined = not slot-bound (custom type); null = slot-bound but nothing free.
// a meal/snack type fills a free menu slot: meal -> lunch/dinner, snack -> snack.
// undefined = the type replaces nothing; null = slot-bound but nothing free.
// an option that replaces a meal/snack fills a free menu slot: meal -> lunch/dinner, snack -> snack.
// undefined = the option replaces nothing; null = slot-bound but nothing free.
function freeSlotFor(x, ds){
  const rp = x.replaces || "";
  if (rp !== "meal" && rp !== "snack") return undefined;
  const d = ds || sel;
  const di2 = dayIdx(parseIso(d));
  const mm = state.nutrition.menu.filter(m => !m.days || m.days.includes(di2));
  const l2 = state.nutrition.logs[d] || {};
  const want = rp === "snack" ? ["snack"] : ["lunch", "dinner"];
  return mm.find(m => want.includes(m.mtype || "snack") && !l2[m.id]) || null;
}
// one cheat use: its points come off the one budget; a meal/snack option fills the given slot (mid)
// or the first free one, else the use voids the day (entry.ns -> xnoslot)
function logCheat(x, mid){
  const label = x.name + (x.amt ? ` · ${x.amt}` : "");
  const entry = { x: x.id, label, cost: num(x.cost, 1), slot: null };
  if (mid) entry.slot = mid;
  else if (x.replaces){
    const slot = freeSlotFor(x);
    if (slot) entry.slot = slot.id;
    else {
      entry.ns = true;
      const ns = state.nutrition.xnoslot = state.nutrition.xnoslot || {};
      ns[sel] = (ns[sel] || 0) + 1;
    }
  }
  if (entry.slot){
    (state.nutrition.xmeal[sel] = state.nutrition.xmeal[sel] || {})[entry.slot] = { x: x.id, label };
    (state.nutrition.logs[sel] = state.nutrition.logs[sel] || {})[entry.slot] = true;
  }
  const tl = state.nutrition.tlog[sel] || (state.nutrition.tlog[sel] = {});
  (tl.all = tl.all || []).push(entry);
}
// points spent in the budget's period window
function cheatPoints(ds){
  const per = (state.cheats || {}).xper || "week";
  const sum = d => ((((state.nutrition.tlog || {})[d] || {}).all) || []).reduce((s2, e) => s2 + num(e.cost, 1), 0);
  if (per === "day") return sum(ds);
  if (per === "month"){
    const pre = ds.slice(0, 7);
    let n = 0;
    for (const k in state.nutrition.tlog) if (k.slice(0, 7) === pre) n += sum(k);
    return n;
  }
  const mon = mondayOf(parseIso(ds));
  let n = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(mon); d.setDate(d.getDate() + i); n += sum(iso(d)); }
  return n;
}

const ICO_DOWN = '<path d="M3 7l6 6l4 -4l8 8" /> <path d="M21 10l0 7l-7 0" />';
const ICO_FLAT = '<path d="M5 12l14 0" />';
const ICO_UP = '<path d="M3 17l6 -6l4 4l8 -8" /> <path d="M14 7l7 0l0 7" />';
const onbIn = (f, v, mode = "decimal") => `<input class="vin" inputmode="${mode}" data-act="onbf" data-f="${f}" value="${esc(v ?? "")}">`;
function startOnb(quiet){
  const p = state.profile;
  onb = { step: 0, mode: p.mode || "cut", wNow: p.weightNow ?? "", fNow: p.fatNow ?? "",
    h: p.heightCm ?? "", waist: p.waistCm ?? "", neck: p.neckCm ?? "",
    wT: p.weightTarget ?? "", fT: p.fatTarget ?? "", len: num(p.lenPlan, 0) || num(p.regimeDays, 30), err: null };
  pages = [{ k: "onb" }]; rowOpen = null; armed = null;
  if (!quiet){ render(); document.getElementById("scroll").scrollTop = 0; }
}
function pageOnb(){
  const o = onb; if (!o) return "";
  const bar = `<div class="obar">${[0, 1, 2, 3].map(i => `<i class="${i <= o.step ? "on" : ""}"></i>`).join("")}</div>`;
  const err = o.err ? `<div class="onote" style="color:var(--bad)">${o.err}</div>` : "";
  let body;
  if (o.step === 0){
    const opt = (m, icon) => `<div class="ocard ${o.mode === m ? "on" : ""}" data-act="onbmode" data-m="${m}"><svg viewBox="0 0 24 24">${icon}</svg>${modeLbl(m)}${o.mode === m ? `<span class="ok">${CK}</span>` : ""}</div>`;
    body = `<div class="oq">What's your goal?</div>${opt("cut", ICO_DOWN)}${opt("maintain", ICO_FLAT)}${opt("bulk", ICO_UP)}`;
  } else if (o.step === 1){
    const tb = tapeBF({ heightCm: o.h, waistCm: o.waist, neckCm: o.neck });
    body = `<div class="oq">Where are you now?</div>
      <div class="lst">${vrow("onb1", 0, "Weight", vEmpty(o.wNow) ? NOTSET : `${fmt(num(o.wNow))} kg`)}${vrow("onb1", 1, "Body fat", vEmpty(o.fNow) ? NOTSET : `${fmt(num(o.fNow))} %`)}</div>
      ${err}
      <div class="grp">Or measure body fat with tape</div>
      <div class="lst">${[["h", "Height"], ["waist", "Waist"], ["neck", "Neck"]].map(([k, lb], j) => vrow("onb1", j + 2, lb, vEmpty(o[k]) ? NOTSET : `${fmt(num(o[k]))} cm`)).join("")}</div>
      ${tb.state === "bad" ? `<div class="onote" style="color:var(--bad)">Waist must be larger than neck</div>`
        : tb.state === "off" ? `<div class="onote" style="color:var(--warm)">${fmt(tb.bf)}% looks off, measure again</div>` : ""}`;
  } else if (o.step === 2){
    const dW = Math.round((num(o.wT, NaN) - num(o.wNow, NaN)) * 10) / 10;
    body = `<div class="oq">Your targets</div>
      <div class="lst">${vrow("onb2", 0, "Target weight", vEmpty(o.wT) ? NOTSET : `${fmt(num(o.wT))} kg`)}${vrow("onb2", 1, "Target body fat", vEmpty(o.fT) ? NOTSET : `${fmt(num(o.fT))} %`)}</div>
      ${err || (!isNaN(dW) ? `<div class="onote">${dW === 0 ? "Hold your weight" : `${dW < 0 ? "&minus;" : "+"}${fmt(Math.abs(dW))} kg`} in ${fmt(num(o.len, 30))} days</div>` : "")}`;
  } else {
    const end = startOfDay(new Date()); end.setDate(end.getDate() + Math.max(1, Math.round(num(o.len, 30))) - 1);
    const opt = n => `<div class="ocard ${num(o.len) === n ? "on" : ""}" data-act="onblen" data-n="${n}">${n} days${num(o.len) === n ? `<span class="ok">${CK}</span>` : ""}</div>`;
    body = `<div class="oq">How long?</div>${opt(30)}${opt(60)}${opt(90)}
      <div class="lst" style="margin-top:4px">${vrow("onb3", 0, "Custom", `${fmt(num(o.len, 30))} days`)}</div>
      ${err || `<div class="onote">Ends ${pdate(iso(end))}</div>`}`;
  }
  const last = o.step === 3;
  return `<div class="otop"><div class="back" data-act="onbback"><svg viewBox="0 0 24 24">${BACK_SVG}</svg></div>${bar}</div>
    ${body}
    <div class="ofoot"><button class="bigbtn" data-act="${last ? "onbstart" : "onbnext"}">${last ? "Start" : "Continue"}</button></div>`;
}
function startCycle(){
  const p = state.profile, o = onb, today = iso(new Date());
  const r = archiveRange();
  if (r) state.regimes.push(cycleRecord(r.from, r.to));
  // a new weight or fat becomes today's log; an unchanged value is never re-logged
  const wN = num(o.wNow, NaN), fN = num(o.fNow, NaN);
  const logIt = (k, v, prev) => {
    if (isNaN(v) || v === num(prev, NaN)) return;
    let m = state.measurements.find(x => x.date === today);
    if (!m){ m = { date: today }; state.measurements.push(m); }
    m[k] = v;
  };
  logIt("weight", wN, p.weightNow); logIt("fat", fN, p.fatNow);
  syncNow();
  if (!isNaN(wN)) p.weightNow = wN;
  if (!isNaN(fN)) p.fatNow = fN;
  p.weightStart = p.weightNow; p.fatStart = p.fatNow;
  p.mode = o.mode;
  p.weightTarget = num(o.wT, num(p.weightTarget));
  if (String(o.fT).trim() !== "") p.fatTarget = num(o.fT, num(p.fatTarget));
  p.heightCm = o.h; p.waistCm = o.waist; p.neckCm = o.neck;
  p.regimeDays = p.lenPlan = Math.max(1, Math.round(num(o.len, 30)));
  p.anchor = today;
  p.onboarded = true; delete p.reviewed;
  onb = null; pages = []; tab = "home"; rowOpen = null;
  save(); render(); document.getElementById("scroll").scrollTop = 0;
}

const WH = 40;                                   // wheel row height
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const AMT_QTYS = [0, 0.25, 0.5, 0.75, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 20, 25, 30, 35, 40, 45, 50, 60, 70, 75,
  80, 90, 100, 110, 120, 125, 130, 140, 150, 160, 170, 175, 180, 190, 200, 220, 225, 250, 275, 300, 330, 350, 400, 450, 500,
  600, 700, 750, 800, 900, 1000, 1250, 1500, 2000];
const NOTSET = `<span style="color:var(--dim)">Not set</span>`;
const F = {
  num: (label, get, set, o) => ({ t: "num", label, get, set, ...o }),   // o: {min, max, dec, unit, def, rr}
  choice: (label, get, set, opts) => ({ t: "choice", label, get, set, opts }),
  date: (label, get, set) => ({ t: "date", label, get, set }),
  amt: (label, get, set) => ({ t: "amt", label, get, set })
};
const vEmpty = v => v == null || v === "" || (typeof v === "number" && isNaN(v));
function vDisp(f, v){
  if (f.t === "choice"){ const o = f.opts.find(x => x[0] === v); return o ? o[1] : NOTSET; }
  if (f.t === "amt") return v ? esc(v) : NOTSET;
  if (vEmpty(v)) return NOTSET;
  if (f.t === "date") return parseIso(v).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  return `${fmt(num(v))}${f.unit ? " " + f.unit : ""}`;
}
function wheelCols(f, v){
  if (f.t === "choice") return [{ items: f.opts.map(o => o[1]), idx: Math.max(0, f.opts.findIndex(o => o[0] === v)) }];
  if (f.t === "num"){

        + (rest.length ? `<div class="tiny" style="margin:12px 0 2px">Other types</div>${rest.map(o => wRow(o, true)).join("")}` : "");
      foot = `<button data-act="shcancel">Cancel</button>`;
    } else if (sheet.kind === "photo"){
      const p = photos.find(x => x.id === sheet.pid);
      title = p ? pdate(p.date, true) : "Photo";
      content = p ? `<img src="${p.url}" decoding="async" style="width:100%;border-radius:14px;display:block">` : "";
      foot = `<button class="ghost" data-act="pdel" data-p="${sheet.pid}" style="color:var(--bad)">${armed === "pdel:" + sheet.pid ? "Tap again to delete" : "Delete"}</button>
        <button class="pri" data-act="shcancel">Close</button>`;
    }
    sroot.innerHTML = `<div class="overlay" data-act="shcancel"></div>
      <div class="sheet${sheetNew ? "" : " noanim"}">
        <div class="shead">${title}</div>
        <div class="sbody">${content}</div>
        <div class="sfoot">${foot}</div>
      </div>`;
    document.body.style.overflow = "hidden";
    sheetNew = false;
  } else {
    sroot.innerHTML = "";
    document.body.style.overflow = "";
  }

  document.getElementById("nav").innerHTML = TABS.map(t =>
    `<button class="${t.id===tab?"on":""}" data-act="tab" data-tab="${t.id}">
      <svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}</button>`).join("");
  const droot = document.getElementById("dockRoot");
  if (dock && !sheet){ droot.innerHTML = dockHTML(); initDock(); dock.shown = true; }
  else droot.innerHTML = "";
  document.getElementById("scroll").style.paddingBottom = dock && !sheet ? "360px" : "";
}

document.addEventListener("click", e => {
  if (Date.now() - swSup < 350) return;          // the tail of a drag is not a tap
  if (dock && !e.target.closest(".dock, [data-act='vopen'], .lbtn")){
    dockAway();
    if (!e.target.closest("[data-act]")) return;
  }
  const el = e.target.closest("[data-act]");
  if (!el){   // tapping a value row's label puts the cursor in its field
    const row = e.target.closest(".li, .lrow"), inp = row && row.querySelector(".vin, .vdate");
    if (inp && !e.target.closest("input,select,textarea")) inp.focus();
    return;
  }
  if (el.tagName === "SELECT" || el.tagName === "INPUT") return;   // fields act on change, not on tap
  const a = el.dataset.act;
  const ARMED_ACTS = ["nreset", "delwk", "pdel", "nmdel", "ndel", "xdel", "delex", "nmidel", "xtdel", "gldel", "npresetdel", "delrule", "endcyc", "npreset", "lddel"];
  if (armed && !ARMED_ACTS.includes(a)) armed = null;

  // ---------- values: the docked wheel ----------
  if (a === "vopen"){ openDock(el.dataset.g, +el.dataset.i || 0, el.dataset, el.dataset.key); return; }
  if (a === "dkdone"){ dockSettle(); dock = null; render(); return; }
  if (a === "witem"){ const col = el.parentElement; col.scrollTo({ top: +el.dataset.k * WH, behavior: "smooth" }); return; }
  // ---------- Trend logs: a marked panel in the list, values on the wheel ----------
  if (a === "lnew" || a === "ledit"){
    if (a === "lnew"){
      const last = k => { const m0 = (state.measurements || []).filter(x => x[k] != null && !isNaN(num(x[k], NaN))).sort((p1, p2) => p1.date < p2.date ? -1 : 1).at(-1);
        return m0 ? num(m0[k]) : num(state.profile[k === "weight" ? "weightNow" : "fatNow"], NaN); };
      logDraft = { mode: "new", orig: null, date: iso(new Date()), w: last("weight"), f: "" };
    } else {
      const m0 = state.measurements.find(x => x.date === el.dataset.d); if (!m0) return;
      logDraft = { mode: "edit", orig: m0.date, date: m0.date, w: m0.weight != null ? num(m0.weight) : "", f: m0.fat != null ? num(m0.fat) : "" };
    }
    armed = null;
    const i0 = vEmpty(logDraft.w) && !vEmpty(logDraft.f) ? 2 : 1;
    openDock("log", i0, {}, dkey("log", i0, ""));
    return;
  }
  if (a === "ldcancel"){ logDraft = null; dock = null; render(); return; }
  if (a === "ldsave" || a === "lddel"){
    const ld = logDraft; if (!ld) return;
    if (a === "lddel" && armed !== "lddel"){ armed = "lddel"; render(); return; }
    armed = null;
    dockSettle();
    if (a === "ldsave" && (!ld.date || (vEmpty(ld.w) && vEmpty(ld.f)))) return;
    const old = ld.orig ? state.measurements.find(x => x.date === ld.orig) : null;
    if (old) state.measurements = state.measurements.filter(x => x !== old);
    if (a === "ldsave"){
      let m0 = state.measurements.find(x => x.date === ld.date);   // another log that day: the values join it
      if (!m0){ m0 = { date: ld.date }; state.measurements.push(m0); }
      if (!vEmpty(ld.w)) m0.weight = ld.w;
      if (!vEmpty(ld.f)) m0.fat = ld.f;
    }
    syncNow(); gSel = null; logDraft = null; dock = null;
    save(); render(); return;
  }

  // ---------- pages ----------
  if (a === "back"){ popPage(); return; }
  if (a === "go"){
    pushPage({ k: el.dataset.k, id: el.dataset.id, w: el.dataset.w, i: el.dataset.i != null ? +el.dataset.i : undefined });
    return;
  }
  if (a === "ring"){ pushPage(cycleEnded() ? { k: "review" } : { k: "cycle" }); return; }
  if (a === "rowopen"){ rowOpen = rowOpen === el.dataset.r ? null : el.dataset.r; wtAdd = null; render(); return; }
  if (a === "pmode"){ state.profile.mode = el.dataset.t; save(); render(); return; }
  if (a === "endcyc"){
    if (armed !== "endcyc"){ armed = "endcyc"; render(); return; }
    armed = null;
    const p = state.profile, de = daysElapsed();
    if (de <= 1){ startOnb(); return; }             // nothing happened yet: straight to a fresh setup
    p.lenPlan = p.lenPlan || num(p.regimeDays, 30);
    p.regimeDays = de - 1;                           // the cycle now ended yesterday
    p.reviewed = cycleEnd();
    save();
    pages = [{ k: "review" }]; rowOpen = null;
    render(); document.getElementById("scroll").scrollTop = 0;
    return;
  }
  if (a === "rvstart"){ startOnb(); return; }
  if (a === "onbmode"){ onb.mode = el.dataset.m; render(); return; }
  if (a === "onblen"){ onb.len = +el.dataset.n; onb.err = null; render(); return; }
  if (a === "onbback"){
    if (onb && onb.step > 0){ onb.step--; onb.err = null; render(); }
    else { onb = null; pages = []; render(); }
    return;
  }
  if (a === "onbnext" || a === "onbstart"){
    const o = onb; if (!o) return;
    const bad = v => String(v ?? "").trim() === "" || isNaN(num(v, NaN));
    o.err = o.step === 1 && bad(o.wNow) ? "Enter your weight"
      : o.step === 2 && bad(o.wT) ? "Enter a target weight"
      : o.step === 3 && (bad(o.len) || num(o.len) < 1) ? "Enter the number of days" : null;
    if (o.err){ render(); return; }
    if (a === "onbstart"){ startCycle(); return; }
    o.step++; render(); document.getElementById("scroll").scrollTop = 0; return;
  }
  if (a === "fopen"){
    foodOpen = +el.dataset.i; render();
    const inp = document.querySelector(`input[data-act="nmif"][data-i="${foodOpen}"]`); if (inp) inp.focus();
    return;
  }
  if (a === "fclose"){ foodOpen = null; render(); return; }

  if (a === "gmetric"){ gMetric = el.dataset.t; gAdd = false; gSel = null; gEdit = null; logDraft = null; dock = null; render(); return; }
  if (a === "gledit"){ gEdit = el.dataset.d; gAdd = false; render(); return; }
  if (a === "glupd"){
    const nd = (document.getElementById("gedate") || {}).value;
    const nv = num((document.getElementById("geval") || {}).value, NaN);
    if (!nd || isNaN(nv)) return;
    const src = state.measurements.find(x => x.date === gEdit);
    if (src){
      if (nd === gEdit) src[gMetric] = nv;
      else {
        delete src[gMetric];
        const other = gMetric === "weight" ? "fat" : "weight";
        if (src[other] == null) state.measurements = state.measurements.filter(x => x !== src);
        let dst = state.measurements.find(x => x.date === nd);
        if (!dst){ dst = { date: nd }; state.measurements.push(dst); }
        dst[gMetric] = nv;
      }
      syncNow();
    }
    gEdit = null; gSel = null; save(); render(); return;
  }
  if (a === "gldel"){
    const k = "gldel:" + (gEdit);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    const m = state.measurements.find(x => x.date === gEdit);
    if (m){
      delete m[gMetric];
      const other = gMetric === "weight" ? "fat" : "weight";
      if (m[other] == null) state.measurements = state.measurements.filter(x => x !== m);
      syncNow();
    }
    gEdit = null; gSel = null; save(); render(); return;
  }
  if (a === "gladd"){ gAdd = true; render(); return; }
  if (a === "glcancel"){ gAdd = false; render(); return; }
  if (a === "glsave"){
    const d = (document.getElementById("gldate") || {}).value;
    const v = num((document.getElementById("glval") || {}).value, NaN);
    if (!d || isNaN(v)) return;
    const ms = state.measurements;
    let m = ms.find(x => x.date === d);
    if (!m){ m = { date: d }; ms.push(m); }   // only the logged metric — never fabricate the other one
    m[gMetric] = v;
    syncNow();
    gAdd = false; save(); render(); return;
  }
  if (a === "paddphoto"){ const f = document.querySelector('input[data-act="pfile"]'); if (f) f.click(); return; }
  if (a === "popen"){ sheetNew = true; sheet = { kind: "photo", pid: el.dataset.p }; render(); return; }
  if (a === "pdel"){
    const id = el.dataset.p;
    if (armed !== "pdel:" + id){ armed = "pdel:" + id; render(); return; }
    armed = null;
    delPhoto(id).then(() => { sheet = null; render(); });
    return;
  }

  if (a === "tab"){ tab = el.dataset.tab; pages = []; onb = null; dock = null; logDraft = null; rowOpen = null; foodOpen = null; wtAdd = null; sheet = null; render(); document.getElementById("scroll").scrollTop = 0; return; }
  if (a === "pick"){ sel = el.dataset.date; sheet = null; dock = null; render(); return; }
  if (a === "shcancel"){ sheet = null; render(); return; }
  if (a === "wshift"){ weekOffset += +el.dataset.d; render(); return; }
  if (a === "addwk"){
    const nw = { id: uid(), title: "New workout", exercises: [], wtype: "strength", days: [dayIdx(parseIso(sel))] };
    syncWMode(nw);
    state.workouts.push(nw);
    save(); pushPage({ k: "wk", id: nw.id }); return;
  }
  if (a === "wchoose"){
    sheetNew = true;
    sheet = { kind: "wpick", wid: el.dataset.w };
    render(); return;
  }
  if (a === "wpickopt"){
    if (!sheet || sheet.kind !== "wpick") return;
    const wid = sheet.wid;
    const wo = state.wopts[sel] || (state.wopts[sel] = {});
    if (el.dataset.id === wid) delete wo[wid]; else wo[wid] = el.dataset.id;
    sheet = null; save(); render(); return;
  }
  if (a === "wkwtype"){
    const w = findWk(el.dataset.w); if (!w) return;
    w.wtype = el.dataset.t;
    save(); render(); return;
  }
  if (a === "wtadd"){ wtAdd = el.dataset.w; wtAddIcon = null; wtAddName = ""; render(); return; }
  if (a === "wtcancel"){ wtAdd = null; wtAddIcon = null; wtAddName = ""; render(); return; }
  if (a === "wtselicon"){
    const inp = document.getElementById("wtname"); if (inp) wtAddName = inp.value;
    wtAddIcon = el.dataset.i; render(); return;
  }
  if (a === "wtsave"){
    const w = findWk(el.dataset.w); if (!w) return;
    const inp = document.getElementById("wtname");
    const name = ((inp && inp.value) || wtAddName || "").trim().toLowerCase();
    if (!name) return;
    if (!state.wtypes.some(t => t.name === name)) state.wtypes.push({ name, icon: wtAddIcon || "zap" });
    w.wtype = name;
    wtAdd = null; wtAddIcon = null; wtAddName = "";
    save(); render(); return;
  }
  if (a === "delwk"){
    const id = el.dataset.w;
    if (armed !== "delwk:" + id){ armed = "delwk:" + id; render(); return; }
    armed = null;
    state.backup = state.backup.filter(x => x.id !== id);
    state.workouts = state.workouts.filter(x => x.id !== id);
    save(); popIf("wk", id); return;
  }
  if (a === "ndone"){
    const id = el.dataset.r;
    const l = state.nutrition.logs[sel] || (state.nutrition.logs[sel] = {});
    if (l[id] && (state.nutrition.xmeal[sel] || {})[id]){
      unXmeal(id);                       // unchecking a cheat-filled slot reverses the cheat log too
      l[id] = false;
    } else l[id] = !l[id];
    save(); render(); return;
  }
  if (a === "hplus" || a === "hminus"){
    const id = el.dataset.r;
    const lg = state.nutrition.logs[sel] || (state.nutrition.logs[sel] = {});
    lg[id] = Math.max(0, num(lg[id], 0) + (a === "hplus" ? 1 : -1));
    if (!lg[id]) delete lg[id];
    save(); render(); return;
  }
  if (a === "nrkind"){
    const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (!r) return;
    if (el.dataset.t === "count"){ r.kind = "count"; if (r.target == null) r.target = 5; }
    else if (el.dataset.t === "limit"){ r.kind = "limit"; if (r.target == null) r.target = 1; }
    else r.kind = "check";
    save(); render(); return;
  }
  if (a === "nrper"){
    const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (!r) return;
    r.xper = el.dataset.t;
    save(); render(); return;
  }
  if (a === "xspend"){   // spend points: pick what to spend them on
    const opts = state.nutrition.exclusions;
    if (!opts.length){ pushPage({ k: "cheats" }); return; }
    if (opts.length === 1){ logCheat(opts[0]); save(); render(); return; }
    sheetNew = true; sheet = { kind: "xpick" };
    render(); return;
  }
  if (a === "xpickopt"){
    if (!sheet || sheet.kind !== "xpick") return;
    const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x);
    if (x) logCheat(x);
    sheet = null; save(); render(); return;
  }
  if (a === "xundo"){
    const list = ((state.nutrition.tlog[sel] || {}).all) || [];
    const e = list.pop();
    if (!e){ render(); return; }
    if (e.slot){
      delete (state.nutrition.xmeal[sel] || {})[e.slot];
      delete (state.nutrition.logs[sel] || {})[e.slot];   // the slot opens back up
    } else if (e.ns){
      const ns = state.nutrition.xnoslot || {};
      if (ns[sel]){ ns[sel]--; if (!ns[sel]) delete ns[sel]; }
    }
    save(); render(); return;
  }
  if (a === "xadd"){
    const nx = { id: uid(), name: "New option", amt: "", cost: 1, replaces: "" };
    state.nutrition.exclusions.push(nx);
    save(); pushPage({ k: "xo", id: nx.id }); return;
  }
  if (a === "xdel"){
    const k = "xdel:" + (el.dataset.x);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    state.nutrition.exclusions = state.nutrition.exclusions.filter(x => x.id !== el.dataset.x);
    save(); popIf("xo", el.dataset.x); return;
  }
  if (a === "xday"){
    const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (!x) return;
    const d = +el.dataset.d;
    x.days = x.days || [1,2,3,4,5,6,7];
    if (x.days.includes(d)) x.days = x.days.filter(z => z !== d);
    else x.days = [...x.days, d].sort();
    if (x.days.length === 7) delete x.days;
    save(); render(); return;
  }
  if (a === "nmadd"){
    const nm = { id: uid(), mtype: "snack", items: [] };
    state.nutrition.menu.push(nm);
    save(); pushPage({ k: "mi", id: nm.id }); return;
  }
  if (a === "nmdel"){
    const k = "nmdel:" + (el.dataset.m);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    state.nutrition.menu = state.nutrition.menu.filter(m => m.id !== el.dataset.m);
    save(); popIf("mi", el.dataset.m); return;
  }
  if (a === "nmchoose"){
    sheetNew = true;
    sheet = { kind: "pick", mid: el.dataset.m };
    render(); return;
  }
  if (a === "pickopt"){
    if (!sheet || sheet.kind !== "pick") return;
    unXmeal(sheet.mid);
    const mo = state.nutrition.mopts[sel] || (state.nutrition.mopts[sel] = {});
    if (!el.dataset.id) delete mo[sheet.mid]; else mo[sheet.mid] = el.dataset.id;
    sheet = null; save(); render(); return;
  }
  if (a === "xmeal"){
    if (!sheet || sheet.kind !== "pick") return;
    const mid = el.dataset.m;
    const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x);
    if (!x){ sheet = null; render(); return; }
    unXmeal(mid);
    logCheat(x, mid);
    if (state.nutrition.mopts[sel]) delete state.nutrition.mopts[sel][mid];
    sheet = null; save(); render(); return;
  }
  if (a === "naddrule"){
    const nh = { id: uid(), name: "New habit", kind: "check" };
    state.nutrition.rules.push(nh);
    save(); pushPage({ k: "habit", id: nh.id }); return;
  }
  if (a === "ndel"){
    const k = "ndel:" + (el.dataset.r);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    state.nutrition.rules = state.nutrition.rules.filter(r => r.id !== el.dataset.r);
    save(); popIf("habit", el.dataset.r); return;
  }
  if (a === "nreset"){
    if (armed !== "nreset"){ armed = "nreset"; render(); return; }
    armed = null;
    const presets = state.nutrition.presets;
    state.nutrition = { rules: [], water: { target: 8, unit: "glasses" },
      logs: {}, presets, menu: [], exclusions: [], exlog: {}, mopts: {}, xpicks: {}, xmeal: {}, tlog: {}, xnoslot: {} };
    state.xtypes = []; state.cheats = { limit: 3, xper: "week" };
    save(); render(); return;
  }
  if (a === "nmiadd"){
    const m = findMenu(el.dataset.m); if (!m) return;
    m.items = m.items || []; m.items.push({ name: "New food", amt: "" });
    foodOpen = m.items.length - 1;
    save(); render();
    const inp = document.querySelector(`input[data-act="nmif"][data-i="${foodOpen}"]`); if (inp){ inp.focus(); inp.select(); }
    return;
  }
  if (a === "nmidel"){
    const k = "nmidel:" + (`${el.dataset.m}:${el.dataset.i}`);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    const m = findMenu(el.dataset.m); if (!m) return;
    m.items.splice(+el.dataset.i, 1); foodOpen = null;
    save(); render(); return;
  }
  if (a === "nmtype"){

  }
  if (a === "nmday"){
    const m = findMenu(el.dataset.m); if (!m) return;
    const d = +el.dataset.d;
    m.days = m.days || [1,2,3,4,5,6,7];
    if (m.days.includes(d)) m.days = m.days.filter(x => x !== d);
    else m.days = [...m.days, d].sort();
    if (m.days.length === 7) delete m.days;
    save(); render(); return;

  if (a === "npreset"){   // applying replaces the whole nutrition setup: tap twice
