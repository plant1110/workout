    const pr = state.nutrition.presets.find(x => x.id === el.dataset.id); if (!pr) return;
    const n2 = state.nutrition;
    const cloneFood = it => typeof it === "string" ? { name: it, amt: "" } : { name: it.name, amt: it.amt || "" };
    if (pr.full){
      n2.rules = (pr.rules || []).map(x => typeof x === "string"
        ? { id: uid(), name: x, kind: "check" }
        : { id: uid(), name: x.name, kind: x.kind || "check", target: x.target, unit: x.unit, xper: x.xper });
      const inferT = name => { const nn = (name || "").toLowerCase();
        return nn.includes("breakfast") ? "breakfast" : nn.includes("lunch") ? "lunch" : nn.includes("dinner") ? "dinner" : "snack"; };
      n2.menu = [];
      (pr.menu || []).forEach(m => {
        n2.menu.push({ id: uid(), mtype: m.mtype || inferT(m.name), items: (m.items || []).map(cloneFood),
          days: m.days ? [...m.days] : undefined });
        (m.alts || []).forEach(a => n2.menu.push({ id: uid(),
          name: (a.name && a.name !== m.name) ? a.name : (((a.items || [])[0] || {}).name || m.name + " 2"),
          mtype: m.mtype || inferT(m.name), days: [], items: (a.items || []).map(cloneFood) }));
      });
      // water lives in the menu now: a water habit from an older preset becomes the water target
      const wIdx = n2.rules.findIndex(r => r.kind === "count" && /^water$/i.test(String(r.name || "").trim()));
      if (wIdx >= 0){ n2.water = { target: Math.max(1, num(n2.rules[wIdx].target, 8)), unit: n2.rules[wIdx].unit || "glasses" }; n2.rules.splice(wIdx, 1); }
      if (pr.water != null) n2.water = { target: Math.max(1, num(pr.water, 8)), unit: "glasses" };
      if (pr.options){
        state.cheats = { limit: num((pr.cheats || {}).limit, 3), xper: (pr.cheats || {}).xper || "week" };
        n2.exclusions = pr.options.map(o => ({ id: uid(), name: o.name, amt: o.amt || "", cost: num(o.cost, 1), days: o.days, replaces: o.replaces || "" }));
      } else if (pr.xtypes){   // v140-v165 preset: per-type budgets merge into one
        n2.exclusions = [];
        state.cheats = { limit: pr.xtypes.reduce((s0, t) => s0 + num(t.limit, 0), 0) || 3, xper: (pr.xtypes[0] || {}).xper || "week" };
        pr.xtypes.forEach(t => (t.options || []).forEach(o => n2.exclusions.push({ id: uid(), name: o.name, amt: o.amt || "",
          cost: num(o.cost, 1), days: o.days, replaces: t.replaces || "" })));
      } else if (pr.exclusions){   // pre-v140 preset: per-cheat entries
        n2.exclusions = []; let lim0 = 0;
        pr.exclusions.forEach(x => {
          const cat = x.xcat || "other", rp = cat === "meal" ? "meal" : cat === "snack" ? "snack" : "";
          lim0 = Math.max(lim0, num(x.limit, 0));
          const it0 = (x.items || [])[0];
          n2.exclusions.push({ id: uid(), name: x.name || (it0 && it0.name) || "Cheat", days: x.days, cost: 1, replaces: rp,
            amt: x.amt || ((x.items || []).length === 1 && it0 && it0.amt) || "" });
          (x.alts || []).forEach(a2 => n2.exclusions.push({ id: uid(), name: typeof a2 === "string" ? a2 : a2.name,
            days: [], cost: 1, replaces: rp, amt: (typeof a2 === "string" ? "" : a2.amt) || "" }));
        });
        state.cheats = { limit: lim0 || 3, xper: "week" };
      }
      state.xtypes = [];
    } else {
      for (const name of pr.rules){
        if (!n2.rules.some(r => r.name === name))
          n2.rules.push({ id: uid(), name, kind: "check" });
      }
    }
    save(); render(); return;
  }
  if (a === "npresetdel"){
    const k = "npresetdel:" + (el.dataset.id);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    state.nutrition.presets = state.nutrition.presets.filter(x => x.id !== el.dataset.id);
    save(); render(); return;
  }
  if (a === "npresetsave"){
    const n2 = state.nutrition;
    let name = null;
    try { name = window.prompt("Preset name:"); } catch(e){}
    if (name === null || name === undefined || !String(name).trim())
      name = "My preset " + (n2.presets.length + 1);
    const copyFood = it => ({ name: it.name, amt: it.amt || "" });
    n2.presets.push({
      id: uid(), name: String(name).trim(), full: true,
      rules: n2.rules.map(r => ({ name: r.name, kind: r.kind, target: r.target, unit: r.unit, xper: r.xper })),
      water: num(waterOf().target, 8),
      menu: n2.menu.map(m => ({ mtype: m.mtype, items: (m.items || []).map(copyFood), days: m.days ? [...m.days] : undefined })),
      cheats: { limit: state.cheats.limit, xper: state.cheats.xper },
      options: n2.exclusions.map(x => ({ name: x.name, amt: x.amt, cost: x.cost, days: x.days, replaces: x.replaces || "" }))
    });
    save(); render(); return;
  }

  if (a === "exdone"){
    toggleDone(sel, { id: el.dataset.ex }); save(); render(); return;
  }
  if (a === "wkday"){
    const w = findWk(el.dataset.w); if (!w) return;
    const d = +el.dataset.d;
    w.days = w.days || [dayIdx(parseIso(sel))];
    if (w.days.includes(d)) w.days = w.days.filter(x => x !== d);
    else w.days = [...w.days, d].sort();
    save(); render(); return;
  }
  if (a === "extype"){
    const w = findWk(el.dataset.w); if (!w) return;
    const ex = w.exercises.find(x => x.id === el.dataset.ex); if (!ex) return;
    if (el.dataset.t === "time"){ ex.type = "time"; if (ex.mins == null) ex.mins = 30; }
    else { delete ex.type; if (ex.sets == null) ex.sets = 3; if (ex.reps == null) ex.reps = 10; if (ex.weight == null) ex.weight = 0; }
    save(); render(); return;
  }
  if (a === "addex"){
    const w = findWk(el.dataset.w); if (!w) return;
    const nx = { id: uid(), name: "New exercise", sets: 3, reps: 10, weight: 0 };
    (w.exercises = w.exercises || []).push(nx); syncWMode(w);
    save(); pushPage({ k: "ex", w: w.id, id: nx.id }); return;
  }
  if (a === "delex"){
    const k = "delex:" + (el.dataset.ex);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    const w = findWk(el.dataset.w); if (!w) return;
    w.exercises = w.exercises.filter(x => x.id !== el.dataset.ex);
    syncWMode(w);
    save(); popIf("ex", el.dataset.ex); return;
  }
  if (a === "addrule"){
    state.rules.push({ id: uid(), scope: "all", metric: "weight", amount: 1, every: 1, cap: "" });
    save(); render(); return;
  }
  if (a === "delrule"){
    const k = "delrule:" + (el.dataset.id);
    if (armed !== k){ armed = k; render(); return; }
    armed = null;
    state.rules = state.rules.filter(r => r.id !== el.dataset.id);
    save(); render(); return;
  }
});

document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.value;

  if (el.classList.contains("vsel")){
    const v2 = el.value;
    if (a === "pmode") state.profile.mode = v2;
    else if (a === "extype"){
      const w = findWk(el.dataset.w), ex = w && (w.exercises || []).find(x => x.id === el.dataset.ex);
      if (ex){
        if (v2 === "time"){ ex.type = "time"; if (ex.mins == null) ex.mins = 30; }
        else { delete ex.type; if (ex.sets == null) ex.sets = 3; if (ex.reps == null) ex.reps = 10; if (ex.weight == null) ex.weight = 0; }
      }
    }
    else if (a === "nrkind"){
      const r = state.nutrition.rules.find(x => x.id === el.dataset.r);
      if (r){
        if (v2 === "count"){ r.kind = "count"; if (r.target == null) r.target = 5; }
        else if (v2 === "limit"){ r.kind = "limit"; if (r.target == null) r.target = 1; }
        else r.kind = "check";
      }
    }
    else if (a === "nrper"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r) r.xper = v2; }
    else if (a === "nmtype"){ const m = findMenu(el.dataset.m); if (m) m.mtype = v2; }
    else if (a === "wkwtype"){
      const w = findWk(el.dataset.w); if (!w) return;
      if (v2 === "__new"){ wtAdd = w.id; wtAddIcon = null; wtAddName = ""; render(); return; }   // opens the new-type row
      w.wtype = v2;
    }
    save(); render(); return;
  }
  if (a === "pfile"){
    const files = [...(el.files || [])];
    el.value = "";
    if (files.length) Promise.all(files.map(addPhoto)).then(() => render());
    return;
  }
  if (a === "nrulef"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r){ r.name = v; save(); } return; }
  if (a === "nrtarget"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r){ r.target = Math.max(r.kind === "limit" ? 0 : 1, num(v, r.target)); el.value = r.target; save(); } return; }
  if (a === "nrunit"){ const r = state.nutrition.rules.find(x => x.id === el.dataset.r); if (r){ r.unit = v; save(); } return; }
  if (a === "nmif"){ const m = findMenu(el.dataset.m); if (m && m.items && m.items[+el.dataset.i]){ m.items[+el.dataset.i].name = v; save(); } return; }
  if (a === "nmiqty" || a === "nmiunit"){
    const m = findMenu(el.dataset.m); const it = m && m.items && m.items[+el.dataset.i]; if (!it) return;
    const p = parseAmt(it.amt);
    if (a === "nmiqty") p.qty = v; else p.unit = v;
    it.amt = joinAmt(p); save(); return;
  }
  if (a === "xf"){ const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (x){ x.name = v; save(); } return; }
  if (a === "xcost"){ const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (x){ x.cost = Math.max(0, num(v, x.cost ?? 1)); el.value = x.cost; save(); } return; }
  if (a === "xq" || a === "xu"){
    const x = state.nutrition.exclusions.find(y => y.id === el.dataset.x); if (!x) return;
    const p = parseAmt(x.amt);
    if (a === "xq") p.qty = v; else p.unit = v;
    x.amt = joinAmt(p); save(); return;
  }
  if (a === "wktitle"){ const w = findWk(el.dataset.w); if (w){ w.title = v; save(); } return; }
  if (a === "wkmins"){ const w = findWk(el.dataset.w); if (w){ w.mins = num(v, w.mins); el.value = w.mins; save(); } return; }
  if (a === "exf"){
    const w = findWk(el.dataset.w); if (!w) return;
    const ex = w.exercises.find(x => x.id === el.dataset.ex); if (!ex) return;
    const f = el.dataset.f;
    ex[f] = f === "name" ? v : num(v, ex[f]);
    if (f !== "name") el.value = ex[f];
    save(); return;
  }
  if (a === "rulef"){
    const r = state.rules.find(x => x.id === el.dataset.id); if (!r) return;
    const f = el.dataset.f;
    r[f] = (f === "scope" || f === "metric") ? v : (f === "cap" && v.trim() === "" ? "" : num(v, 0));
    save(); render(); return;
  }
  if (a === "prof" && el.dataset.f === "regimeDays"){
    const n2 = Math.round(num(v, NaN));
    if (!isNaN(n2) && n2 >= 1) state.profile.regimeDays = state.profile.lenPlan = n2;
    el.value = state.profile.regimeDays;
    save(); return;
  }
  if (a === "prof"){
    const f = el.dataset.f;
    const tape = f === "heightCm" || f === "waistCm" || f === "neckCm";
    state.profile[f] = f === "mode" ? v : (tape && v.trim() === "") ? "" : num(v, num(state.profile[f]));
    let touchedNow = f === "weightNow" || f === "fatNow";
    if (tape){
      const tb = tapeBF(state.profile);
      if (tb.state === "ok"){ state.profile.fatNow = tb.bf; touchedNow = true; }
    }
    if (touchedNow){
      const date = iso(new Date());
      const w = num(state.profile.weightNow), ft = num(state.profile.fatNow);
      const found = state.measurements.find(m => m.date === date);
      if (found){ found.weight = w; found.fat = ft; } else state.measurements.push({ date, weight: w, fat: ft });
    }
    save(); return;
  }
});

// value fields are as wide as their value, so the unit sits right after it
document.addEventListener("input", e => {
  const t = e.target;
  if (t.classList && t.classList.contains("vin")) t.size = Math.max(1, (t.value || t.placeholder || "").length) + 1;
});
// onboarding fields keep the draft as you type; tape measurements fill in body fat
document.addEventListener("input", e => {
  const el = e.target.closest('[data-act="onbf"]'); if (!el || !onb) return;
  const f = el.dataset.f;
  onb[f] = el.value;
  if (f === "h" || f === "waist" || f === "neck"){
    const tb = tapeBF({ heightCm: onb.h, waistCm: onb.waist, neckCm: onb.neck });
    if (tb.state === "ok"){
      onb.fNow = tb.bf;
      const fi = document.querySelector('[data-act="onbf"][data-f="fNow"]'); if (fi) fi.value = tb.bf;
    }
  }
});

/* ---------- drag to reorder ---------- */
const DRAG_LISTS = {
  workouts: () => state.workouts,
  menu:     () => state.nutrition.menu,
  habits:   () => state.nutrition.rules,
  xopts:    () => state.nutrition.exclusions
};
// nested lists are addressed as "kind:parentId"; food/option rows have no ids, so they carry their index
function dragListFor(key){
  if (DRAG_LISTS[key]) return { list: DRAG_LISTS[key](), byIndex: false };
  const c = key.indexOf(":"); if (c < 0) return null;
  const kind = key.slice(0, c), id = key.slice(c + 1);
  if (kind === "exs"){ const w = state.workouts.find(x => x.id === id); return w ? { list: w.exercises = w.exercises || [], byIndex: false } : null; }
  if (kind === "xopts"){ return { list: state.nutrition.exclusions, byIndex: false }; }
  if (kind === "mfoods"){ const m = state.nutrition.menu.find(x => x.id === id); return m ? { list: m.items = m.items || [], byIndex: true } : null; }
  return null;
}
let drag = null;

function reorderSubset(list, ids){
  const idxs = ids.map(id => list.findIndex(x => x.id === id)).filter(i => i >= 0).sort((a, b) => a - b);
  const items = ids.map(id => list.find(x => x.id === id)).filter(Boolean);
  idxs.forEach((pos, k) => list[pos] = items[k]);
}

document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".dragh");
  if (!h) return;
  const row = h.closest("[data-drag-row]");
  if (!row) return;
  e.preventDefault();
  drag = { key: h.dataset.drag, row, container: row.parentElement };
  row.classList.add("dragging");
  try { h.setPointerCapture(e.pointerId); } catch(err) {}
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  e.preventDefault();
  const rows = [...drag.container.querySelectorAll(":scope > [data-drag-row]")];
  const over = rows.find(r => r !== drag.row && (b => e.clientY > b.top && e.clientY < b.bottom)(r.getBoundingClientRect()));
  if (over){
    const b = over.getBoundingClientRect();
    if (e.clientY < b.top + b.height / 2) drag.container.insertBefore(drag.row, over);
    else drag.container.insertBefore(drag.row, over.nextSibling);
  }
}, { passive: false });
document.addEventListener("pointerup", () => {
  if (!drag) return;
  swSup = Date.now();
  drag.row.classList.remove("dragging");
  const ids = [...drag.container.querySelectorAll(":scope > [data-drag-row]")].map(r => r.dataset.id);
  const t = dragListFor(drag.key);
  drag = null;
  if (t){
    if (t.byIndex){ const items = ids.map(i => t.list[+i]).filter(Boolean); t.list.splice(0, t.list.length, ...items); }
    else reorderSubset(t.list, ids);
    save();
  }
  render();
});
document.addEventListener("pointercancel", () => {
  if (!drag) return;
  drag.row.classList.remove("dragging");
  drag = null; render();
});

/* ---------- plan pages: hold a row, then drag it to reorder ---------- */
let hold = null;
document.addEventListener("pointerdown", e => {
  const row = e.target.closest("[data-hold]");
  if (!row || e.target.closest("input,select,textarea,button")) return;
  const x0 = e.clientX, y0 = e.clientY;
  hold = { x0, y0, t: setTimeout(() => {
    hold = null;
    drag = { key: row.dataset.hold, row, container: row.parentElement };
    row.classList.add("dragging");
  }, 380) };
});
document.addEventListener("pointermove", e => {
  if (hold && (Math.abs(e.clientX - hold.x0) > 8 || Math.abs(e.clientY - hold.y0) > 8)){ clearTimeout(hold.t); hold = null; }
});
const endHold = () => { if (hold){ clearTimeout(hold.t); hold = null; } };
document.addEventListener("pointerup", endHold);
document.addEventListener("pointercancel", endHold);
document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });

// one-time (v148): seed frozen verdicts so the ring looks as it did before v147 removed
// history — an item counts on a past day only if it shows any logged activity by that day,
// so recently added workouts/menu items don't retro-poison old days. Then the freeze rule owns it.
if (!state.verdictSeed1){
  const today = iso(new Date());
  const firstLog = {};
  const noteLog = (id, d) => { if (!firstLog[id] || d < firstLog[id]) firstLog[id] = d; };
  for (const d in state.logs) for (const id in state.logs[d]) noteLog(id, d);
  for (const d in state.nutrition.logs) for (const id in state.nutrition.logs[d]) noteLog(id, d);
  const existedBy = (id, ds) => firstLog[id] && firstLog[id] <= ds;
  const start = parseIso(state.profile.anchor || today);
  if (!isNaN(start)) for (let d = new Date(start), i = 0; iso(d) < today && i < 400; d.setDate(d.getDate() + 1), i++){
    const ds = iso(d);
    const exIds = exercisesFor(ds).map(e => e.id).filter(id => existedBy(id, ds));
    const wPlanned = exIds.length > 0;
    const wOk = !wPlanned || exIds.every(id => exDone(ds, { id }));
    const habs = state.nutrition.rules.filter(h => existedBy(h.id, ds));
    const nTracked = habs.length > 0;
    const nOk = !nTracked || (habs.every(h => habitDone(h, ds)) && weekOkFor(ds) && !num((state.nutrition.xnoslot || {})[ds], 0));
    state.verdicts[ds] = { wPlanned, wOk, nTracked, nOk };
  }
  state.verdictSeed1 = true;
}
save();
bootPages();
render();
loadPhotos().then(render);   // photos arrive async from IndexedDB, repaint when ready
// iOS standalone underreports the window height by the status-bar inset (win 793 vs screen 852
// on iPhone 15 Pro) — in that container only 100vh resolves to the full glass, so use it there
if (navigator.standalone) document.body.style.height = "100vh";

// installable app: register the service worker when served over http(s) with sw.js alongside
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
